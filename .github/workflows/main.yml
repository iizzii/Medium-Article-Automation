name: Daily Medium Draft Automator

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Fixes the Ubuntu migration notice

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Upgraded to fix Node.js 20 warning

    - name: Set up Python
      uses: actions/setup-python@v5 # Upgraded to fix Node.js 20 warning
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright & System Dependencies
      run: playwright install --with-deps chromium # Added --with-deps to ensure Linux has everything it needs

    - name: Run Automator Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MEDIUM_COOKIES: ${{ secrets.MEDIUM_COOKIES }}
      run: python main.py
