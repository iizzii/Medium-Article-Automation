name: Daily Medium Draft Automator

on:
  schedule:
    # Runs at 2:30 AM UTC, which is exactly 8:00 AM IST.
    - cron: '30 2 * * *'
  workflow_dispatch: # This line adds a button so you can run it manually anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Run Automator Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MEDIUM_COOKIES: ${{ secrets.MEDIUM_COOKIES }}
      run: python main.py
