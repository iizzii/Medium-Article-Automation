# Content pillars focused on Mobile (Android & iOS) Pentesting, Mobile Malware Analysis, and AI Security
pillars:
  - id: android_pentesting
    name: Android App Pentesting & Reverse Engineering
    description: >
      Practical Android security testing: APK/AAB decompilation, exported components
      (Activities, Services, ContentProviders, BroadcastReceivers), Deep Links, WebViews,
      SSL pinning, Frida hooking, and Keystore/biometric security.
    seed_themes:
      - exploiting exported Android components and insecure Intent/DeepLink handling
      - bypassing SSL pinning and root detection with Frida in modern Android apps
      - WebView JavaScriptInterface and file-access pitfalls in hybrid apps
      - auditing Android Keystore, BiometricPrompt, and local storage safely
    tags:
      - Android Security
      - Mobile Pentesting
      - Frida
      - Reverse Engineering
      - Cybersecurity

  - id: ios_pentesting
    name: iOS App Pentesting & Runtime Analysis
    description: >
      Hands-on iOS security assessment: IPA structure, Mach-O binaries, Keychain
      accessibility classes, Universal Links, URL schemes, Swift/Obj-C runtime hooking,
      and ATS/TLS pinning checks.
    seed_themes:
      - auditing iOS Keychain items and Data Protection classes in real apps
      - Universal Links vs custom URL schemes security pitfalls
      - hooking Swift and Objective-C methods with Frida on jailbroken and non-jailbroken devices
      - local authentication, FaceID/TouchID, and plist/cache data leakage
    tags:
      - iOS Security
      - Mobile Pentesting
      - AppSec
      - Reverse Engineering
      - Cybersecurity

  - id: mobile_malware_analysis
    name: Mobile Malware Analysis & Threat Hunting
    description: >
      Analyzing Android and iOS malware families, Accessibility Service abuse,
      dynamic DEX/payload loading, malicious SDKs, stalkerware, and mobile C2 traffic.
    seed_themes:
      - how Android banking trojans abuse Accessibility Services and overlay attacks
      - unpacking dynamically loaded DEX payloads and obfuscated droppers
      - detecting malicious ad/analytics SDKs and supply-chain trojans in mobile apps
      - analyzing mobile C2 protocols and certificate-pinned malware traffic
    tags:
      - Malware Analysis
      - Mobile Security
      - Android Malware
      - Threat Intelligence
      - InfoSec

  - id: mobile_ai_security
    name: Applied AI for Mobile Security & App Triage
    description: >
      Using LLMs and ML for mobile app triage, APK/IPA static analysis, on-device
      AI model security (TFLite/CoreML), and prompt-injection risks in mobile AI features.
    seed_themes:
      - using LLMs to triage decompiled Android/iOS code without hallucinating vulnerabilities
      - extracting and auditing on-device TFLite and CoreML models from mobile binaries
      - prompt injection and insecure tool use in mobile AI assistants
      - designing practical evals for AI-assisted mobile malware classification
    tags:
      - AI Security
      - Mobile Security
      - LLM
      - AppSec
      - Machine Learning

  - id: mobile_security_automation
    name: Mobile Security Automation & MASVS Pipelines
    description: >
      Automating mobile security checks in CI/CD: MobSF/jadx/apkleaks workflows,
      OWASP MASVS/MASTG verification, and reducing false positives for mobile devs.
    seed_themes:
      - automating OWASP MASVS checks in CI/CD without slowing down mobile releases
      - building lightweight Python scanners for AndroidManifest.xml and Info.plist bugs
      - triaging noisy static mobile scanner findings with automated reachability checks
      - automating APK/IPA diffing across app store releases
    tags:
      - Mobile AppSec
      - Security Automation
      - OWASP MASVS
      - DevSecOps
      - Cybersecurity

  - id: mobile_fraud_abuse
    name: Mobile Fraud, Bot Abuse & App Integrity
    description: >
      Defending mobile backends against emulators, device farms, Frida tampering,
      Play Integrity / App Attest bypasses, and automated credential/API abuse.
    seed_themes:
      - understanding Play Integrity and Apple App Attest—and where they fall short
      - detecting emulators, hooking frameworks, and device farms in mobile telemetry
      - securing mobile APIs against replay attacks and automated scraping
      - balancing anti-tampering controls with legitimate user experience
    tags:
      - Fraud Detection
      - Mobile Security
      - App Integrity
      - API Security
      - Trust And Safety

  - id: leading_mobile_security
    name: Leading Mobile Security & AppSec Teams
    description: >
      Scoping mobile pentests, writing actionable bug reports for Android/iOS engineers,
      calibration, and running effective mobile security programs.
    seed_themes:
      - writing mobile pentest findings that iOS and Android developers actually fix
      - scoping a 5-day mobile app pentest using OWASP MASTG priorities
      - triaging mobile bug bounty reports and filtering out low-impact scanner noise
      - building developer-friendly secure storage and networking templates for mobile teams
    tags:
      - AppSec
      - Mobile Security
      - Penetration Testing
      - Engineering Leadership
      - Security Operations
